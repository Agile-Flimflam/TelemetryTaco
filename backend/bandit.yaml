# Bandit configuration for the TelemetryTaco backend.

exclude_dirs:
  - .venv
  - core/migrations

# Each skip below is needed today; remove it if the reason goes away.
# B101 assert_used: pytest tests use plain asserts.
# B104 hardcoded_bind_all_interfaces: ALLOWED_HOSTS defaults include 0.0.0.0 for local dev.
# B105 hardcoded_password_string: dev and test settings ship placeholder SECRET_KEYs;
#      production settings refuse to start with the placeholder.
skips:
  - B101
  - B104
  - B105
