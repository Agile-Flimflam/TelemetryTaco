name: Release images

# Pushing a tag like v1.2.3 publishes both images to GHCR as :1.2.3 and :latest.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish ${{ matrix.image }} image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - image: backend
            context: backend
            file: backend/Dockerfile
          - image: frontend
            context: .
            file: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # GHCR names must be lowercase. A manual run without a tag publishes only :sha-<commit>.
      - name: Compute tags
        id: tags
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          name="ghcr.io/${GITHUB_REPOSITORY,,}-${IMAGE}"
          tags="${name}:sha-${GITHUB_SHA::7}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tags="${tags},${name}:${GITHUB_REF_NAME#v},${name}:latest"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.image }}
