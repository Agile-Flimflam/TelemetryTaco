name: Feature request
description: Suggest something TelemetryTaco should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: How it could work. Rough is fine.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
