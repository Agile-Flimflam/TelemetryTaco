# `docker compose up` runs the whole stack for local use: http://localhost:5173.
# Shared by backend, worker and beat so their settings can't drift apart. These win over
# backend/.env, which the ./backend mount also brings in.
x-backend-env: &backend-env
  DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-telemetry_taco}
  REDIS_URL: redis://redis:6379/0
  CACHE_URL: redis://redis:6379/1
  # The frontend's dev server proxies /api with Host: backend:8000.
  ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0,backend

services:
  db:
    image: postgres:16
    container_name: telemetry-taco-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-telemetry_taco}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: telemetry-taco-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: telemetry-taco-backend
    environment: *backend-env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Seeds demo events on first boot only, so restarts keep whatever you've captured.
    command: >
      sh -c "python manage.py migrate --noinput --fake-initial
      && python manage.py seed_events --if-empty
      && exec python manage.py runserver 0.0.0.0:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/live')"
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 60s

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: telemetry-taco-worker
    environment: *backend-env
    volumes:
      - ./backend:/app
    # Waits for the backend so migrations have run before it writes events.
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A config worker --loglevel=info

  # Runs scheduled tasks (CELERY_BEAT_SCHEDULE), such as the hourly retention purge. Keep exactly
  # one, or each task runs once per beat process.
  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: telemetry-taco-beat
    environment: *backend-env
    volumes:
      - ./backend:/app
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A config beat --loglevel=info --schedule /tmp/celerybeat-schedule

  frontend:
    image: node:24-slim
    container_name: telemetry-taco-frontend
    working_dir: /app
    environment:
      API_PROXY_TARGET: http://backend:8000
      # Outside /app, or pnpm creates its store inside your checkout.
      npm_config_store_dir: /pnpm-store
    ports:
      - "5173:5173"
    # The repo root holds the pnpm workspace and lockfile. The anonymous volumes keep the
    # container's Linux node_modules apart from the host's.
    volumes:
      - .:/app
      - /app/node_modules
      - /app/frontend/node_modules
      - pnpm_store:/pnpm-store
    depends_on:
      backend:
        condition: service_healthy
    # pnpm 10 matches CI.
    command: >
      sh -c "npm install --global pnpm@10
      && CI=true pnpm install --frozen-lockfile
      && exec pnpm --dir frontend dev"

volumes:
  postgres_data:
  redis_data:
  pnpm_store:
